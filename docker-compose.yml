services:
  mongodb:
    image: mongo:7
    container_name: agrishield-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: agrishield
      MONGO_INITDB_ROOT_PASSWORD: change_this_password
    volumes:
      - agrishield_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "agrishield", "--password", "change_this_password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  agrishield_mongo_data: