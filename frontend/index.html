<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1c3d2a" />
  <title>AgriShield — Crop Doctor & Smart Agriculture</title>
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <header class="top">
    <a class="brand" href="#home">
      <span class="brand-mark material-symbols-outlined">eco</span>
      <span><strong>AgriShield</strong><small>Smart farming, simply</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="top-right">
      <button id="installAppBtn" class="btn sm" style="display:none; align-items:center; gap:4px; font-size:12px; padding:6px 12px; background:#10b981; color:#fff;" onclick="installPWA()"><span class="material-symbols-outlined" style="font-size:16px">install_mobile</span><span>Install App</span></button>
      <a href="/api/download-report" download="AgriShield_SIH_Feature_Report.pdf" class="btn light sm" style="text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:6px 12px;" title="Download Feature PDF Report"><span class="material-symbols-outlined" style="font-size:16px">picture_as_pdf</span><span>PDF Report</span></a>
      <div class="online-badge"><span class="online-dot"></span><span>Online</span></div>
      <select id="lang" class="lang" aria-label="Language"></select>
      <button class="icon-btn" id="bellBtn" title="Alerts" aria-label="Alerts"><span class="material-symbols-outlined">notifications</span></button>
      <button class="ghost" id="authBtn"></button>
      <button class="icon-btn mobile-menu" type="button" aria-label="Open navigation" onclick="toggleMobileNav()"><span class="material-symbols-outlined">menu</span></button>
    </div>
  </header>
  <nav class="mobile-nav" id="mobileNav" aria-label="App navigation"></nav>
  <aside class="alerts" id="alerts" hidden></aside>
  <div class="offline-banner" id="offlineBanner" role="status" hidden></div>
  <main id="app"></main>
  <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation"></nav>
  <footer class="foot">
    AI indication only · Not a replacement for professional agricultural diagnosis · SIH AgriShield
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
